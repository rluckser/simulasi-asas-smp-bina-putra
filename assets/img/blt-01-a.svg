<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img">
<title>Garis bilangan dengan titik -4, ?, 2, dan 5 berjarak sama</title>
<rect x="0" y="0" width="400" height="300" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<line x1="20" y1="150" x2="392" y2="150" stroke="#1f2a37" stroke-width="2"/>
<polygon points="392,150 380,144 380,156" fill="#1f2a37"/>
<polygon points="20,150 32,144 32,156" fill="#1f2a37"/>
<g stroke="#1f2a37" stroke-width="2">
<line x1="20" y1="144" x2="20" y2="156"/>
<line x1="50" y1="144" x2="50" y2="156"/>
<line x1="80" y1="144" x2="80" y2="156"/>
<line x1="110" y1="144" x2="110" y2="156"/>
<line x1="140" y1="144" x2="140" y2="156"/>
<line x1="170" y1="144" x2="170" y2="156"/>
<line x1="200" y1="144" x2="200" y2="156"/>
<line x1="230" y1="144" x2="230" y2="156"/>
<line x1="260" y1="144" x2="260" y2="156"/>
<line x1="290" y1="144" x2="290" y2="156"/>
<line x1="320" y1="144" x2="320" y2="156"/>
<line x1="350" y1="144" x2="350" y2="156"/>
<line x1="380" y1="144" x2="380" y2="156"/>
</g>
<g fill="#1d4ed8">
<circle cx="80" cy="150" r="7"/>
<circle cx="170" cy="150" r="7"/>
<circle cx="260" cy="150" r="7"/>
<circle cx="350" cy="150" r="7"/>
</g>
<text x="170" y="122" font-size="22" fill="#1d4ed8" text-anchor="middle" font-weight="bold">?</text>
<g font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="bold">
<text x="80" y="182">-4</text>
<text x="260" y="182">2</text>
<text x="350" y="182">5</text>
</g>
<text x="200" y="230" font-size="15" fill="#1f2a37" text-anchor="middle">Titik-titik berjarak sama</text>
</g>
</svg>
