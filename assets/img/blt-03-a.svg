<path d="M200,150 L84,150" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arwB)"/>
<text x="142" y="138" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="bold">4 satuan ke kiri</text>
<path d="M80,118 L166,118" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arwG)"/>
