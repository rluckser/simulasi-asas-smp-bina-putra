<line x1="200" y1="174" x2="200" y2="186"/>
<line x1="230" y1="174" x2="230" y2="186"/>
<line x1="260" y1="174" x2="260" y2="186"/>
<line x1="290" y1="174" x2="290" y2="186"/>
