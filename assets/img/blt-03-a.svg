</marker>
<marker id="arwG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<polygon points="0,0 9,3 0,6" fill="#15803d"/>
</marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif">
<line x1="20" y1="180" x2="392" y2="180" stroke="#1f2a37" stroke-width="2"/>
<polygon points="392,180 380,174 380,186" fill="#1f2a37"/>
<polygon points="20,180 32,174 32,186" fill="#1f2a37"/>
