<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img">
<title>Juring lingkaran, jari-jari 7 cm, panjang busur 11 cm</title>
<rect x="0" y="0" width="400" height="300" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<circle cx="200" cy="160" r="110" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M200,160 L310,160 A110,110 0 0 0 200,50 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<line x1="200" y1="160" x2="310" y2="160" stroke="#1d4ed8" stroke-width="2"/>
<line x1="200" y1="160" x2="200" y2="50" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="200" cy="160" r="4" fill="#1f2a37"/>
<text x="268" y="46" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="bold">busur = 11 cm</text>
<text x="245" y="152" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="bold">r = 7 cm</text>
