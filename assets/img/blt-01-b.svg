<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img">
<title>Garis bilangan dengan titik -6, ?, 0, dan 3 berjarak sama</title>
