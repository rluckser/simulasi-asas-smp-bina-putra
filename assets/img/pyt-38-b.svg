<rect x="0" y="0" width="400" height="300" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<line x1="60" y1="280" x2="330" y2="280" stroke="#1f2a37" stroke-width="4"/>
<line x1="280" y1="40" x2="280" y2="280" stroke="#1f2a37" stroke-width="4"/>
<path d="M280,260 L260,260 L260,280" fill="none" stroke="#1f2a37" stroke-width="2"/>
<line x1="145" y1="280" x2="280" y2="100" stroke="#1d4ed8" stroke-width="5"/>
<text x="258" y="195" font-size="16" fill="#1d4ed8" text-anchor="end" font-weight="bold">12 m</text>
<text x="212" y="298" font-size="16" fill="#1d4ed8" text-anchor="middle" font-weight="bold">9 m</text>
<text x="188" y="172" font-size="24" fill="#1d4ed8" text-anchor="middle" font-weight="bold">?</text>
