<polygon points="210,95 235,72 235,142 210,165" fill="#bbf7d0" stroke="#1f2a37" stroke-width="2"/>
<rect x="140" y="95" width="70" height="70" fill="#dcfce7" stroke="#1f2a37" stroke-width="2"/>
<line x1="60" y1="272" x2="290" y2="272" stroke="#166534" stroke-width="1.5"/>
